<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willow Knowledge Graph</title>
<link rel="stylesheet" href="https://unpkg.com/vis-network/standalone/umd/vis-network.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { display: flex; height: 100vh; background: #1a1a1a; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

#graphArea {
  position: relative;
  flex: 0 0 75%;
  height: 100vh;
}
#network { width: 100%; height: 100%; }

#sidebar {
  flex: 0 0 25%;
  background: #242424;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 20px 16px;
  border-left: 1px solid #333;
}

.sidebar-header { margin-bottom: 4px; }
.sidebar-header h1 { color: #2d6a4f; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
.sidebar-header p { color: #888; font-size: 0.78rem; margin-top: 2px; }

#stats { color: #aaa; font-size: 0.82rem; margin: 10px 0; }

hr { border: none; border-top: 1px solid #333; margin: 10px 0; }

.filter-section { margin-bottom: 10px; }
.filter-section label { color: #aaa; font-size: 0.82rem; display: block; margin-bottom: 6px; }

.filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.filter-row label { color: #aaa; font-size: 0.82rem; white-space: nowrap; margin-bottom: 0; }

#minMentions {
  background: #333;
  border: 1px solid #444;
  color: #fff;
  padding: 4px 8px;
  border-radius: 4px;
  width: 56px;
  font-size: 0.82rem;
}
#minMentions:focus { outline: none; border-color: #2d6a4f; }

#refreshBtn {
  background: #2d6a4f;
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: background 0.15s;
}
#refreshBtn:hover { background: #3a8a65; }

.type-filters { display: flex; flex-direction: column; gap: 6px; }
.type-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
  cursor: pointer;
  padding: 2px 0;
}
.type-filter input { cursor: pointer; accent-color: #2d6a4f; }
.type-filter .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

#detailPanel { display: none; margin-top: 4px; }
#detailPanel.visible { display: block; }

.detail-name {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.3;
  word-break: break-word;
}
.detail-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: #fff;
  text-transform: capitalize;
}
.detail-mentions { color: #aaa; font-size: 0.82rem; margin-bottom: 8px; }
.detail-desc { color: #888; font-size: 0.8rem; line-height: 1.5; }

/* Spinner overlay */
#spinner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 10;
}
#spinner.visible { display: flex; }
.spin {
  width: 40px;
  height: 40px;
  border: 3px solid #333;
  border-top-color: #2d6a4f;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#spinnerLabel { color: #888; font-size: 0.82rem; }

/* Error message */
#errorMsg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #2a1414;
  border: 1px solid #c0392b;
  color: #e74c3c;
  padding: 16px 24px;
  border-radius: 8px;
  display: none;
  max-width: 380px;
  text-align: center;
  font-size: 0.88rem;
  z-index: 10;
}
#errorMsg.visible { display: block; }
</style>
</head>
<body>

<div id="graphArea">
  <div id="network"></div>
  <div id="spinner">
    <div class="spin"></div>
    <span id="spinnerLabel">Loading graph...</span>
  </div>
  <div id="errorMsg"></div>
</div>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>Willow</h1>
    <p>Knowledge Graph</p>
  </div>
  <div id="stats">— nodes &middot; — edges</div>
  <hr>
  <div class="filter-row">
    <label for="minMentions">Min mentions:</label>
    <input type="number" id="minMentions" value="2" min="1" max="9999">
    <button id="refreshBtn">Refresh</button>
  </div>
  <div class="type-filters" id="typeFilters"></div>
  <hr>
  <div id="detailPanel">
    <div class="detail-name" id="detailName"></div>
    <span class="detail-badge" id="detailBadge"></span>
    <div class="detail-mentions" id="detailMentions"></div>
    <div class="detail-desc" id="detailDesc"></div>
  </div>
</div>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script>
const TYPE_COLORS = {
  person:   '#4a90d9',
  project:  '#2d6a4f',
  concept:  '#9b59b6',
  tool:     '#d4860a',
  location: '#c0392b',
  event:    '#8b4513'
};
const DEFAULT_COLOR = '#666';

let network = null;
let allNodes = null;
let allEdges = null;
let currentNodeId = null;

// DOM refs
const spinner    = document.getElementById('spinner');
const errorMsg   = document.getElementById('errorMsg');
const statsEl    = document.getElementById('stats');
const detailPanel   = document.getElementById('detailPanel');
const typeFiltersEl = document.getElementById('typeFilters');
const detailName    = document.getElementById('detailName');
const detailBadge   = document.getElementById('detailBadge');
const detailMentions = document.getElementById('detailMentions');
const detailDesc    = document.getElementById('detailDesc');

function showSpinner(v) {
  spinner.classList.toggle('visible', v);
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('visible');
}

function hideError() {
  errorMsg.classList.remove('visible');
}

function buildTypeFilters(types) {
  typeFiltersEl.innerHTML = '';
  types.forEach(type => {
    const color = TYPE_COLORS[type] || DEFAULT_COLOR;
    const div = document.createElement('div');
    div.className = 'type-filter';
    div.innerHTML =
      '<input type="checkbox" id="cb_' + type + '" data-type="' + type + '" checked>' +
      '<span class="dot" style="background:' + color + '"></span>' +
      '<label for="cb_' + type + '" style="color:' + color + '">' + type + '</label>';
    div.querySelector('input').addEventListener('change', applyTypeFilter);
    typeFiltersEl.appendChild(div);
  });
}

function getCheckedTypes() {
  return new Set(
    [...typeFiltersEl.querySelectorAll('input:checked')].map(el => el.dataset.type)
  );
}

function applyTypeFilter() {
  if (!allNodes) return;
  const checked = getCheckedTypes();
  const updates = allNodes.get().map(n => ({
    id: n.id,
    hidden: !checked.has(n.type || 'unknown')
  }));
  allNodes.update(updates);
}

function highlightNode(nodeId) {
  if (!network || !allNodes || !allEdges) return;
  const connectedNodes = new Set(network.getConnectedNodes(nodeId));
  connectedNodes.add(nodeId);

  allNodes.update(allNodes.get().map(n => ({
    id: n.id,
    opacity: connectedNodes.has(n.id) ? 1 : 0.15
  })));

  allEdges.update(allEdges.get().map(e => ({
    id: e.id,
    color: (e.from === nodeId || e.to === nodeId)
      ? { color: '#aaa', opacity: 1 }
      : { color: '#222', opacity: 0.15 }
  })));
}

function resetHighlight() {
  if (!allNodes || !allEdges) return;
  allNodes.update(allNodes.get().map(n => ({ id: n.id, opacity: 1 })));
  allEdges.update(allEdges.get().map(e => ({
    id: e.id,
    color: { color: '#444' }
  })));
}

function showDetail(node) {
  const color = TYPE_COLORS[node.type] || DEFAULT_COLOR;
  detailName.textContent = node.label || node.id;
  detailBadge.textContent = node.type || 'unknown';
  detailBadge.style.background = color;
  detailMentions.textContent = (node.mentions || 0) + ' mention' + ((node.mentions === 1) ? '' : 's');
  if (node.description) {
    detailDesc.textContent = node.description;
    detailDesc.style.display = 'block';
  } else {
    detailDesc.style.display = 'none';
  }
  detailPanel.classList.add('visible');
}

function hideDetail() {
  detailPanel.classList.remove('visible');
  currentNodeId = null;
}

async function loadGraph(minMentions) {
  showSpinner(true);
  hideError();
  hideDetail();
  resetHighlight();

  try {
    const url = '/api/knowledge/graph?min_mentions=' + encodeURIComponent(minMentions) + '&max_nodes=600&max_edges_per_node=20';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const data = await res.json();
    renderGraph(data.nodes || [], data.edges || []);
  } catch (e) {
    showError('Failed to load graph: ' + e.message);
  } finally {
    showSpinner(false);
  }
}

function renderGraph(nodes, edges) {
  // Build type list from data
  const typeSet = new Set();
  nodes.forEach(n => { if (n.type) typeSet.add(n.type); });
  const types = [...typeSet].sort();
  buildTypeFilters(types);

  // Build vis DataSets
  const visNodes = nodes.map(n => {
    const color = TYPE_COLORS[n.type] || DEFAULT_COLOR;
    return {
      id: n.id,
      label: n.label || String(n.id),
      type: n.type || 'unknown',
      mentions: n.mentions || 0,
      description: n.description || '',
      size: n.size || 10,
      color: { background: color, border: color, highlight: { background: color, border: '#fff' } },
      title: (n.label || n.id) + (n.description ? '\n' + n.description : ''),
      opacity: 1
    };
  });

  const visEdges = edges.map((e, i) => ({
    id: e.id !== undefined ? e.id : i,
    from: e.from,
    to: e.to,
    width: e.width || 1,
    title: e.type || '',
    color: { color: '#444' }
  }));

  allNodes = new vis.DataSet(visNodes);
  allEdges = new vis.DataSet(visEdges);

  statsEl.textContent = nodes.length + ' nodes \u00b7 ' + edges.length + ' edges';

  const container = document.getElementById('network');
  const options = {
    nodes: {
      shape: 'dot',
      font: { color: '#fff', size: 13 },
      borderWidth: 2,
      scaling: { min: 8, max: 30 }
    },
    edges: {
      color: { color: '#666', highlight: '#ccc', opacity: 0.8 },
      smooth: { type: 'continuous' },
      width: 1.5
    },
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -120,
        springLength: 180,
        springConstant: 0.05,
        damping: 0.4
      },
      stabilization: { iterations: 200 }
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      hideEdgesOnDrag: true
    }
  };

  if (network) {
    network.destroy();
    network = null;
  }

  network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, options);

  network.on('click', function(params) {
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      currentNodeId = nodeId;
      const node = allNodes.get(nodeId);
      highlightNode(nodeId);
      showDetail(node);
    } else {
      currentNodeId = null;
      resetHighlight();
      hideDetail();
    }
  });
}

// Refresh button
document.getElementById('refreshBtn').addEventListener('click', function() {
  const val = parseInt(document.getElementById('minMentions').value, 10);
  loadGraph(isNaN(val) || val < 1 ? 1 : val);
});

// Initial load
loadGraph(2);
</script>
</body>
</html>
