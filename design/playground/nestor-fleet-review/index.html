<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestor — fleet review (mock)</title>
  <style>
    :root {
      --bg: #14150f;
      --surface: #1c1e17;
      --panel: #23261d;
      --border: #2e3128;
      --text: #ece9e1;
      --dim: #9c988e;
      --accent: #8fbc9b;
      --sealed: #7fc39a;
      --draft: #d7a94f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      padding: 12px 22px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .brand b { font-size: 19px; letter-spacing: .02em; color: var(--accent); }
    .brand span { color: var(--dim); font-style: italic; font-size: 13px; }
    .spacer { flex: 1; }
    .acting { font-size: 12px; color: var(--dim); font-family: ui-monospace, monospace; }
    .acting em { color: var(--text); font-style: normal; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      font-size: 11px; padding: 3px 9px; border-radius: 99px;
      border: 1px solid var(--border); color: var(--dim);
    }
    .pill.ok { color: var(--sealed); border-color: color-mix(in srgb, var(--sealed) 50%, var(--border)); }
    .tabs {
      display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .tab {
      padding: 12px 16px 10px; color: var(--dim); cursor: default; position: relative;
      border: none; background: none; font: inherit;
    }
    .tab.on { color: var(--accent); font-weight: 600; }
    .tab.on::after {
      content: ''; position: absolute; bottom: -1px; left: 10px; right: 10px;
      height: 2px; background: var(--accent);
    }
    .shell {
      flex: 1; display: grid; grid-template-columns: 1fr min(400px, 38vw);
      min-height: 0;
    }
    .left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 12px 22px; border-bottom: 1px solid var(--border);
      background: var(--surface); font-family: ui-monospace, monospace; font-size: 12px;
      flex-shrink: 0;
    }
    .filters input, .filters select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 6px; font: inherit;
    }
    .list { flex: 1; overflow-y: auto; padding: 8px 12px 24px; }
    .item {
      padding: 14px 12px; border-radius: 10px; cursor: pointer;
      border: 1px solid transparent; margin-bottom: 6px;
    }
    .item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .item.on { background: var(--panel); border-color: var(--border); }
    .item h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .item p { font-size: 13px; color: var(--dim); }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      font-size: 11px; padding: 2px 7px; border-radius: 6px;
      border: 1px solid var(--border); color: var(--dim);
    }
    .chip.sealed { color: var(--sealed); }
    .chip.draft { color: var(--draft); }
    .right { overflow-y: auto; padding: 20px 22px; min-height: 0; }
    .oracle {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      color: var(--dim); padding: 32px;
    }
    .oracle .glyph { font-size: 48px; opacity: .35; margin-bottom: 16px; }
    .panel h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--dim); margin-bottom: 12px;
    }
    .path {
      display: flex; gap: 10px; align-items: flex-start; margin: 10px 0;
      padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    }
    .path input { margin-top: 3px; accent-color: var(--accent); }
    .path label { flex: 1; font-size: 14px; }
    .path small { display: block; margin-top: 4px; color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px; }
    .btn {
      margin-top: 14px; padding: 8px 16px; border-radius: 7px; border: none;
      background: var(--accent); color: #14150f; font-weight: 600; cursor: pointer;
    }
    .context { margin-top: 18px; font-size: 13px; color: var(--dim); white-space: pre-wrap; }
    .banner {
      font-size: 12px; text-align: center; padding: 6px;
      background: color-mix(in srgb, var(--draft) 15%, var(--surface));
      color: var(--draft); flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="banner">Layout mock only — not wired to Nestor. Grok Desktop file was incomplete.</div>
  <header class="topbar">
    <div class="brand"><b>Nestor</b> <span>In medio, fides</span></div>
    <div class="spacer"></div>
    <div class="acting">acting as <em>sean campbell</em></div>
    <div class="pills">
      <span class="pill ok">5 sealed</span>
      <span class="pill">0 draft</span>
      <span class="pill ok">signed seals</span>
      <span class="pill ok">ledger ok</span>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab">Queue</button>
    <button class="tab on">Memory</button>
    <button class="tab">Ask</button>
    <button class="tab">Signals</button>
    <button class="tab">Ledger</button>
  </nav>
  <div class="shell">
    <div class="left">
      <div class="filters">
        <input placeholder="contains…" size="16">
        <select><option>sealed</option><option>any status</option></select>
        <select><option>fleet-gap → fleet-gap</option></select>
        <span class="spacer"></span>
        <button class="btn" style="margin:0;font-size:12px">Apply</button>
      </div>
      <div class="list" id="list"></div>
    </div>
    <aside class="right" id="side">
      <div class="oracle">
        <div class="glyph">◇</div>
        <p>Select a decision on the left to read paths, background, and provenance.</p>
      </div>
    </aside>
  </div>
  <script>
    const DECISIONS = [
      {
        id: "G1", status: "sealed", title: "Phase 1 gate — orient / cold start",
        blurb: "Hanuman fixes orient so agents land on the right ritual without fighting the boot gate.",
        paths: [
          ["A", "Dispatch Hanuman to fix orient.md / boot ordering", "DECISION: assign Hanuman — orient fix"],
          ["B", "Document-only; no fleet dispatch", "DECISION: document only"],
          ["C", "Defer until STACK E2E exists", "DECISION: defer"],
        ],
        sealed: "A",
      },
      {
        id: "G3", status: "sealed", title: "Schema confirm + Kart witness",
        blurb: "No sign-off until schema mapping is confirmed and Kart has run the witness path.",
        paths: [
          ["A", "Operator witnesses schema + Kart before Phase 1 close", "DECISION: block sign-off until schema+Kart"],
        ],
        sealed: "A",
      },
      {
        id: "G5", status: "sealed", title: "Latest handoff freshness",
        blurb: "Hanuman ensures latest_handoff is trustworthy for Jarvis continuity.",
        paths: [
          ["A", "Hanuman refresh handoff pipeline", "DECISION: assign Hanuman — latest_handoff"],
        ],
        sealed: "A",
      },
    ];

    const list = document.getElementById("list");
    const side = document.getElementById("side");

    function renderSide(d) {
      if (!d) {
        side.innerHTML = '<div class="oracle"><div class="glyph">◇</div><p>Select a decision on the left to read paths, background, and provenance.</p></div>';
        return;
      }
      const paths = d.paths.map(([id, label, seal]) => {
        const checked = d.sealed === id ? "checked" : "";
        return `<label class="path"><input type="radio" name="p" ${checked} disabled><div><strong>${id})</strong> ${label}<small>If you seal: ${seal}</small></div></label>`;
      }).join("");
      side.innerHTML = `
        <div class="panel">
          <h2>Your call</h2>
          <p style="margin-bottom:8px">${d.blurb}</p>
          ${paths}
          ${d.status === "sealed" ? '<p class="context" style="margin-top:14px">Sealed — fleet apply script / dispatches already ran for this store.</p>' : '<button class="btn">Seal this commitment</button>'}
          <div class="context">Background reading (mock)\n\nLoki audit excerpt would appear here with file:// links.</div>
        </div>`;
    }

    DECISIONS.forEach((d, i) => {
      const el = document.createElement("div");
      el.className = "item" + (i === 0 ? " on" : "");
      el.innerHTML = `
        <h3>${d.id}: ${d.title}</h3>
        <p>${d.blurb}</p>
        <div class="meta">
          <span class="chip ${d.status}">${d.status}</span>
          <span class="chip">fleet-gap</span>
        </div>`;
      el.onclick = () => {
        document.querySelectorAll(".item").forEach((n) => n.classList.remove("on"));
        el.classList.add("on");
        renderSide(d);
      };
      list.appendChild(el);
    });
    renderSide(DECISIONS[0]);
  </script>
</body>
</html>
