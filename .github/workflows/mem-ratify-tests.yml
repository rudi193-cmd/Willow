name: mem_ratify tests

on:
  push:
    # Main only — an unfiltered push trigger plus pull_request runs CI
    # twice on every PR commit.
    branches: [main]
  pull_request:
  schedule:
    # Daily drift catcher, off the :00/:30 peak-load minutes — fleet pattern.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff==0.15.0 bandit

      - name: Ruff (enforced)
        run: ruff check mem_ratify

      - name: Bandit (enforced — tree is clean, keep it that way)
        run: bandit -r mem_ratify -ll -q

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run mem_ratify test suite (stdlib only, under coverage)
        run: |
          pip install coverage
          coverage run --include='mem_ratify/*' --omit='mem_ratify/tests/*' -m unittest discover -s mem_ratify/tests -t . -p "test_*.py" -v
          # Floor, not target: measured 98.7%. Ratchet up, never down.
          coverage report --fail-under=95

      - name: Same suite under -O
        # Asserts are stripped under -O. Safety controls must not live in
        # asserts (utety's A4 pattern) — proving the suite holds optimized
        # keeps that regression class from landing silently.
        run: python -O -m unittest discover -s mem_ratify/tests -t . -p "test_*.py"

  # Aggregate gate: branch protection across the fleet requires a single
  # check named exactly "test". Green only when lint and every leg are.
  test:
    needs: [test-matrix, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint and all matrix legs green"
